<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Personal AI high level architecture</title><desc id="desc">Sources feed an Android gateway and the platform, which stores data in Supabase and returns assistance to devices.</desc>
<style>text{font-family:Arial,sans-serif;fill:#102a43}.h{font-size:22px;font-weight:bold}.t{font-size:15px}.box{stroke:#1f4e79;stroke-width:2;rx:12;fill:#eaf3fb}.group{stroke:#7c9bb8;stroke-width:2;rx:18;fill:#f7fbff}.arr{stroke:#1f4e79;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1f4e79"/></marker></defs>
<rect class="group" x="20" y="30" width="250" height="620"/><text class="h" x="88" y="65">Sources</text>
<rect class="box" x="50" y="100" width="190" height="80"/><text class="t" x="79" y="132">XIAO ESP32S3</text><text class="t" x="76" y="154">camera and microphone</text>
<rect class="box" x="50" y="230" width="190" height="80"/><text class="t" x="79" y="262">Nothing Phone 2a Plus</text><text class="t" x="71" y="284">location notifications app</text>
<rect class="box" x="50" y="360" width="190" height="80"/><text class="t" x="73" y="392">Xiaozhi N16R8</text><text class="t" x="72" y="414">speaker and playback</text>
<rect class="box" x="50" y="490" width="190" height="80"/><text class="t" x="64" y="522">Calendar integrations</text><text class="t" x="69" y="544">and notification context</text>
<rect class="group" x="320" y="220" width="250" height="210"/><text class="h" x="352" y="255">Android gateway</text><text class="t" x="350" y="292">pairing encryption</text><text class="t" x="350" y="317">offline queue location</text><text class="t" x="350" y="342">permissions playback</text><text class="t" x="350" y="367">calendar controls</text>
<rect class="group" x="640" y="30" width="440" height="620"/><text class="h" x="767" y="65">Platform</text>
<rect class="box" x="690" y="100" width="150" height="75"/><text class="t" x="724" y="133">API gateway</text><text class="t" x="709" y="154">auth validation</text>
<rect class="box" x="890" y="100" width="150" height="75"/><text class="t" x="913" y="133">Stream manager</text><text class="t" x="921" y="154">fan out control</text>
<rect class="box" x="690" y="235" width="150" height="100"/><text class="t" x="725" y="268">Face workers</text><text class="t" x="707" y="290">detect track embed</text><text class="t" x="720" y="312">approved matching</text>
<rect class="box" x="890" y="235" width="150" height="100"/><text class="t" x="918" y="268">Visual workers</text><text class="t" x="920" y="290">OCR scene vector</text><text class="t" x="903" y="312">deep understanding</text>
<rect class="box" x="690" y="395" width="150" height="100"/><text class="t" x="719" y="428">Audio workers</text><text class="t" x="715" y="450">ASR audio events</text><text class="t" x="714" y="472">transcript segments</text>
<rect class="box" x="890" y="395" width="150" height="100"/><text class="t" x="908" y="428">Fusion and policy</text><text class="t" x="915" y="450">event revisions</text><text class="t" x="899" y="472">proactive decisions</text>
<rect class="box" x="760" y="545" width="210" height="65"/><text class="t" x="795" y="574">Agent and retrieval</text><text class="t" x="788" y="595">evidence backed actions</text>
<rect class="group" x="1140" y="170" width="230" height="340"/><text class="h" x="1181" y="205">Supabase</text><rect class="box" x="1170" y="245" width="170" height="75"/><text class="t" x="1210" y="278">Postgres RLS</text><text class="t" x="1195" y="299">events facts vectors</text><rect class="box" x="1170" y="370" width="170" height="75"/><text class="t" x="1211" y="403">Storage</text><text class="t" x="1190" y="424">private raw media</text>
