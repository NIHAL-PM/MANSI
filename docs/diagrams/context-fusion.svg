<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
<title id="title">Event time context fusion</title><desc id="desc">Independent audio, face, visual, calendar, and location observations with different processing times are fused by occurrence time into versioned memory events.</desc>
<style>text{font-family:Arial,sans-serif;fill:#102a43}.h{font-size:22px;font-weight:bold}.t{font-size:14px}.lane{stroke:#aac1d3;stroke-width:1;fill:#f8fbfd}.event{fill:#eaf3fb;stroke:#1f4e79;stroke-width:2;rx:8}.late{fill:#fff3df;stroke:#a45c00;stroke-width:2;rx:8}.line{stroke:#1f4e79;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1f4e79"/></marker></defs>
<text class="h" x="510" y="42">Fuse by Observed Time Not Arrival Time</text>
<text class="t" x="55" y="100">Source timeline</text><line x1="220" y1="95" x2="1320" y2="95" stroke="#1f4e79" stroke-width="3"/><text class="t" x="270" y="80">10:30:04</text><text class="t" x="565" y="80">10:30:05</text><text class="t" x="865" y="80">10:30:06</text><text class="t" x="1165" y="80">10:30:09</text>
<rect class="lane" x="30" y="130" width="1340" height="55"/><text class="t" x="50" y="162">Camera</text><rect class="event" x="260" y="141" width="190" height="34"/><text class="t" x="278" y="163">frame captured 10:30:04.2</text>
<rect class="lane" x="30" y="205" width="1340" height="55"/><text class="t" x="50" y="237">Audio</text><rect class="event" x="500" y="216" width="240" height="34"/><text class="t" x="518" y="238">speech: Good to see you Priya</text>
<rect class="lane" x="30" y="280" width="1340" height="55"/><text class="t" x="50" y="312">Phone</text><rect class="event" x="225" y="291" width="200" height="34"/><text class="t" x="242" y="313">location: cafe, accuracy 8m</text><rect class="event" x="820" y="291" width="230" height="34"/><text class="t" x="835" y="313">calendar: Priya catch-up</text>
<text class="t" x="55" y="387">Processing completion</text><rect class="late" x="800" y="360" width="245" height="45"/><text class="t" x="820" y="388">face result at 10:30:06.8</text><rect class="late" x="1080" y="360" width="240" height="45"/><text class="t" x="1100" y="388">OCR result at 10:30:09.5</text>
<line class="line" x1="920" y1="405" x2="920" y2="470"/><line class="line" x1="1200" y1="405" x2="1000" y2="470"/>
<rect class="event" x="520" y="470" width="510" height="85"/><text class="t" x="570" y="503">memory event evt_2048 revision 3</text><text class="t" x="550" y="528">cafe conversation, possible Priya, calendar context, linked evidence</text>
<line class="line" x1="355" y1="175" x2="600" y2="470"/><line class="line" x1="620" y1="250" x2="720" y2="470"/><line class="line" x1="935" y1="325" x2="850" y2="470"/>
</svg>
